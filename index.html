<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bertram Baddies — Training Journal</title>
<meta name="theme-color" content="#100e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baddies">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="chartGrad" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#e11d3a" stop-opacity=".38"/>
    <stop offset="1" stop-color="#e11d3a" stop-opacity="0"/>
  </linearGradient>
</defs></svg>

<div class="app">
  <div class="bglogo" aria-hidden="true"></div>
  <div class="topbar">
    <img id="brandImg" src="assets/logo.png" alt="Bertram Baddies" onerror="this.style.display='none'">
    <div style="flex:1;min-width:0;">
      <div class="hdr brand">BERTRAM BADDIES</div>
      <div class="lbl sub" id="topSub">TRAINING JOURNAL</div>
    </div>
  </div>
  <main class="screen" id="screen"></main>
  <div id="timerbar" class="timerbar" aria-live="polite"></div>
  <nav class="nav" id="nav"></nav>
</div>
<div id="overlay"></div>

<script src="app.js"></script>
</body>
</html>
